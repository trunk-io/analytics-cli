[package]
name = "bazel-bep"
version = "0.2.2"
edition = "2024"
description = "Message definitions for bazel's Build Event Protocol"
license = "MIT"
repository = "https://github.com/ChristianBelloni/bazel-bep"

[dependencies]
prost = "0.14"
prost-types = "0.14"
pbjson = "0.9"
pbjson-types = "0.9"
serde = { version = "1.0.215", default-features = false, features = ["derive"] }
serde_json = "1.0.133"

[build-dependencies]
prost-build = "0.14"
pbjson-build = "0.9"
protox = "0.9"
