name: Build and test context-js

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request: {}
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  # Trunk decides which jobs this PR needs. Fails open: no verdict means no
  # output, so every gate below tests `!= 'false'`. Gating is scoped to
  # pull_request -- push (main), tags and dispatch run everything outright.
  dynamic-ci-filter:
    name: Dynamic CI Filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    # Per-job outputs are set at runtime, so they are re-exported here by name.
    outputs:
      build: ${{ steps.ci-filter.outputs.build }}
    steps:
      - name: Run Dynamic CI Filter
        id: ci-filter
        uses: trunk-io/dynamic-ci@v1
        with:
          # Prod, not staging: this repo's merge queue lives in prod.
          token: ${{ secrets.TRUNK_PROD_ORG_API_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: [dynamic-ci-filter]
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
      needs.dynamic-ci-filter.outputs.build != 'false')
    steps:
      - uses: actions/checkout@v4

      - name: Get date and SHA for S3 upload
        id: get-date-sha
        if: "!cancelled() && github.event_name != 'pull_request'"
        shell: bash
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date "+%Y-%m-%d")
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "sha=${GIT_SHA}" >> $GITHUB_OUTPUT
          echo "reference=${DATE}/${GIT_SHA}" >> $GITHUB_OUTPUT

      - name: Setup and build wasm
        uses: ./.github/actions/setup_build_wasm
        if: "!cancelled()"

      - name: Upload wasm package
        uses: actions/upload-artifact@v4
        if: "!cancelled()"
        with:
          name: context-js-pkg
          path: ./context-js/pkg

      - name: Test wasm package
        if: "!cancelled()"
        run: pnpm run --dir ./context-js test

      - name: Package wasm package
        if: "!cancelled()"
        run: pnpm pack --dir ./context-js/pkg

      - name: Upload wasm package to S3
        uses: ./.github/actions/upload_to_s3
        if: "!cancelled() && github.event_name != 'pull_request'"
        with:
          bucket: ${{ secrets.S3_ASSET_BUCKET }}
          name: context-js-0.1.0.tgz
          path: context-js/pkg/context-js-0.1.0.tgz
          role-to-assume: ${{ secrets.S3_UPLOAD_ROLE_ARN }}
          date: ${{ steps.get-date-sha.outputs.date }}
          sha: ${{ steps.get-date-sha.outputs.sha }}

      - name: Annotate workflow with S3 reference
        if: "!cancelled() && github.event_name != 'pull_request'"
        run: |
          echo "::notice title=Published bindings::context-js bindings published to S3 at ${{ steps.get-date-sha.outputs.reference }}"

  gate:
    name: context-js Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Branch-protection fan-in: one stable required context for this whole workflow.
    # A matrix job skipped by its job-level `if:` reports a single check run under the
    # *unexpanded* name (`Test for ${{ matrix.platform.target }}`) because the matrix is
    # never evaluated -- so per-leg contexts never report and required checks hang on
    # "Expected". This job always runs, so its name always reports.
    if: always()
    needs: [build]
    steps:
      - name: Check fan-in results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        shell: bash
        run: |
          read -ra results <<<"${RESULTS}"
          for result in "${results[@]}"; do
            case "${result}" in
            # A skipped job is a pass: it was deliberately not run for this change.
            success | skipped) ;;
            *)
              echo "::error::a needed job reported '${result}'"
              exit 1
              ;;
            esac
          done
          echo "needed jobs all passed or were skipped: ${RESULTS}"
