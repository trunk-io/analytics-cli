name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Version/tag to release
        required: true

jobs:
  release_cli:
    name: Trigger CLI Release
    uses: ./.github/workflows/release_cli.yml
    # A called workflow's jobs can hold no more than its caller grants; publishing to S3 needs
    # the OIDC token.
    permissions:
      contents: write
      id-token: write
    secrets: inherit
    with:
      release_tag: ${{ inputs.version }}

  release_ruby_gem:
    name: Trigger Ruby Gem Release
    needs: [release_cli]
    uses: ./.github/workflows/release_ruby_gem.yml
    secrets: inherit
    with:
      release_tag: ${{ inputs.version }}
