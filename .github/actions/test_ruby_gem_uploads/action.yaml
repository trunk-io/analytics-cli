name: Test Ruby Gem Release
description: Run stable tests for a Ruby gem release
author: trunk.io

inputs:
  ruby-version:
    description: Ruby versions to test
    required: true
  artifact-pattern:
    default: cross-gem-*
    description: Artifact pattern to download
    required: false
  trunk-token:
    description: Trunk API token
    required: true
  trunk-public-api-address:
    description: Trunk public API address
    required: false
    default: https://api.trunk-staging.io
  trunk-org-slug:
    description: The organization to upload the tests for
    required: false
    default: trunk-staging-org
  platform:
    description: The platform that the gem was built for
    required: true
  test-collection-id:
    description: Optional 8 character alphanumeric ID for a test collection
    required: false
  variant:
    description: Optional variant label to distinguish uploads within a matrix
    required: false
  run-gem-unit-suite:
    description: >-
      When 'true', also run the gem's portable unit suite
      (rspec-trunk-flaky-tests/test) against the built gem. Off by default so PR
      runs do not duplicate the source-level `rake test`; enabled by the periodic
      main-branch smoke workflow to exercise the suite on the built artifact.
    required: false
    default: "false"
  knapsack-pro-test-suite-token-rspec:
    description: Optional Knapsack Pro test suite token for RSpec
    required: true
  alpine:
    description: Run the smoke specs inside a musl (Alpine) container via docker instead of on the host
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - uses: ruby/setup-ruby@v1
      if: inputs.alpine != 'true'
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: true
        working-directory: ${{ github.action_path }}

    - uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.artifact-pattern }}
        path: ${{ github.action_path }}
        merge-multiple: true

    - name: Run smoke specs in a musl (Alpine) container
      if: inputs.alpine == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.trunk-public-api-address }}
        TRUNK_ORG_URL_SLUG: ${{ inputs.trunk-org-slug }}
        TRUNK_API_TOKEN: ${{ inputs.trunk-token }}
        TRUNK_TEST_COLLECTION_ID: ${{ inputs.test-collection-id }}
        TRUNK_VARIANT: ${{ inputs.variant }}
      run: |
        set -euxo pipefail
        GEM_FILE=$(ls rspec_trunk_flaky_tests-*.gem | head -n 1)
        REL="${GITHUB_ACTION_PATH#"${GITHUB_WORKSPACE}"/}"

        # Forward the (non-secret) GitHub CI context into the container.
        env | grep -E '^GITHUB_' > "${RUNNER_TEMP}/ci.env" || true

        docker run --rm \
          --env-file "${RUNNER_TEMP}/ci.env" \
          -e GEM_FILE="${GEM_FILE}" \
          -e TRUNK_PUBLIC_API_ADDRESS -e TRUNK_ORG_URL_SLUG -e TRUNK_API_TOKEN \
          -e TRUNK_TEST_COLLECTION_ID -e TRUNK_VARIANT \
          -v "${GITHUB_WORKSPACE}:/work" -w "/work/${REL}" \
          "ruby:${{ inputs.ruby-version }}-alpine" \
          sh -euxc '
            gem install rspec --no-document
            gem install "./${GEM_FILE}" --local --no-document
            rspec -Ispec spec/test_spec.rb spec/multiple_exception_spec.rb --format documentation
          '

    - name: Setup gem
      id: setup-gem
      if: inputs.alpine != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        gem install rspec
        GEM_FILE=$(ls rspec_trunk_flaky_tests-*.gem | head -n 1)
        echo "Using gem file: ${GEM_FILE}"

        # Read the version from gem metadata (robust to the platform suffix).
        GEM_VERSION=$(ruby -e "require 'rubygems/package'; puts Gem::Package.new(ARGV[0]).spec.version" "${GEM_FILE}")
        echo "Extracted version: ${GEM_VERSION}"

        gem install "${GEM_FILE}" --local
        # Unpack the specific gem file directly, not from installed gems
        mkdir -p rspec_trunk_flaky_tests
        gem unpack "${GEM_FILE}" --spec --target=rspec_trunk_flaky_tests
        gem unpack "${GEM_FILE}" --target=rspec_trunk_flaky_tests
        mv rspec_trunk_flaky_tests/rspec_trunk_flaky_tests*/lib rspec_trunk_flaky_tests/lib

        sed -i.bak "/gem 'rspec_trunk_flaky_tests'.*/d" Gemfile && rm -f Gemfile.bak
        bundle install
        echo "gem 'rspec_trunk_flaky_tests', '${GEM_VERSION}', :path => './rspec_trunk_flaky_tests'" >> Gemfile

        bundle lock --remove-platform ruby || true
        bundle install --gemfile Gemfile --local

    - name: Run regular tests
      id: run-regular-tests
      if: inputs.alpine != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        bundle exec rspec spec/test_spec.rb spec/multiple_exception_spec.rb --format documentation
      env:
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.trunk-public-api-address }}
        TRUNK_ORG_URL_SLUG: ${{ inputs.trunk-org-slug }}
        TRUNK_API_TOKEN: ${{ inputs.trunk-token }}
        TRUNK_TEST_COLLECTION_ID: ${{ inputs.test-collection-id }}
        TRUNK_VARIANT: ${{ inputs.variant }}

    # Gated on trunk-org-slug (not a dedicated input) so the prod caller never writes here.
    # TC monitors: https://app.trunk-staging.io/trunk-staging-org/flaky-tests/collections/Gtnr7BWl/monitors
    - name: Run regular tests (repo-wide collection)
      id: run-regular-tests-repo-wide
      if: inputs.alpine != 'true' && inputs.trunk-org-slug == 'trunk-staging-org'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        bundle exec rspec spec/test_spec.rb spec/multiple_exception_spec.rb --format documentation
      env:
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.trunk-public-api-address }}
        TRUNK_ORG_URL_SLUG: ${{ inputs.trunk-org-slug }}
        TRUNK_API_TOKEN: ${{ inputs.trunk-token }}
        TRUNK_TEST_COLLECTION_ID: Gtnr7BWl # analytics-cli-repo-wide (constant for this repo)
        TRUNK_VARIANT: ${{ inputs.variant }}

    - name: Run gem unit suite against the built gem (rspec-trunk-flaky-tests/test)
      id: run-gem-unit-suite
      if: ${{ inputs.run-gem-unit-suite == 'true' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      # Runs the gem's portable unit suite (rspec-trunk-flaky-tests/test) against
      # the built, packaged gem -- making the periodic main-branch smoke run a
      # superset of the source-level `rake test` suite. Gated (off by default) so
      # PR runs of this action do not re-run those specs; enabled only where the
      # checkout matches the built gem (see smoke_test_main.yml). Backend-free, so
      # auto-upload is disabled; the backend scenario specs below cover the rest.
      run: bundle exec rspec "${GITHUB_WORKSPACE}/rspec-trunk-flaky-tests/test" --format documentation
      env:
        DISABLE_RSPEC_TRUNK_FLAKY_TESTS: "true"

    - name: Run variant quarantine test without variant (should fail - not quarantined)
      id: run-variant-test-no-variant
      if: inputs.alpine != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        set +e
        bundle exec rspec spec/variant_quarantine_spec.rb --format documentation
        EXIT_CODE=$?
        if [ $EXIT_CODE -eq 0 ]; then
          echo "ERROR: Variant quarantine test without variant should have failed (test should not be quarantined)"
          exit 1
        else
          echo "SUCCESS: Variant quarantine test without variant failed as expected (test is not quarantined)"
        fi
      env:
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.trunk-public-api-address }}
        TRUNK_ORG_URL_SLUG: ${{ inputs.trunk-org-slug }}
        TRUNK_API_TOKEN: ${{ inputs.trunk-token }}
        TRUNK_TEST_COLLECTION_ID: ${{ inputs.test-collection-id }}
        TRUNK_VARIANT: ""

    - name: Run variant and pending quarantine tests with variant (should pass - quarantined)
      id: run-variant-test-with-variant
      if: inputs.alpine != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        bundle exec rspec spec/variant_quarantine_spec.rb spec/pending_spec.rb --format documentation
        EXIT_CODE=$?
        if [ $EXIT_CODE -ne 0 ]; then
          echo "ERROR: Quarantine tests with variant should have passed (tests should be quarantined)"
          echo "Note: variant_quarantine_test and pending_quarantine_test must be quarantined with variant 'smoke-test-variant' in the system"
          exit 1
        else
          echo "SUCCESS: Quarantine tests with variant passed (tests were quarantined)"
        fi
      env:
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.trunk-public-api-address }}
        TRUNK_ORG_URL_SLUG: ${{ inputs.trunk-org-slug }}
        TRUNK_API_TOKEN: ${{ inputs.trunk-token }}
        TRUNK_TEST_COLLECTION_ID: ${{ inputs.test-collection-id }}
        TRUNK_VARIANT: smoke-test-variant

    - name: Run pending quarantine test without variant (should fail - not quarantined)
      id: run-pending-test-no-variant
      if: inputs.alpine != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        set +e
        bundle exec rspec spec/pending_spec.rb --format documentation
        EXIT_CODE=$?
        if [ $EXIT_CODE -eq 0 ]; then
          echo "ERROR: Pending quarantine test without variant should have failed (fixed-pending is not quarantined)"
          exit 1
        else
          echo "SUCCESS: Pending quarantine test without variant failed as expected (fixed-pending is not quarantined)"
        fi
      env:
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.trunk-public-api-address }}
        TRUNK_ORG_URL_SLUG: ${{ inputs.trunk-org-slug }}
        TRUNK_API_TOKEN: ${{ inputs.trunk-token }}
        TRUNK_TEST_COLLECTION_ID: ${{ inputs.test-collection-id }}
        TRUNK_VARIANT: ""

    - name: Run quarantine lookup failure abort test (should fail fast, skip slow_test)
      id: run-quarantine-abort-test
      if: inputs.alpine != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        set +e
        timeout 25s bundle exec rspec spec/test_spec.rb spec/slow_test.rb --format documentation
        EXIT_CODE=$?
        if [ $EXIT_CODE -eq 124 ]; then
          echo "ERROR: Test run exceeded 25s timeout — slow_test was not skipped (abort regression)"
          exit 1
        elif [ $EXIT_CODE -eq 0 ]; then
          echo "ERROR: Expected non-zero exit (fail_test should fail)"
          exit 1
        else
          echo "SUCCESS: Quarantine lookup failure aborted run before slow_test (exit ${EXIT_CODE})"
        fi
      env:
        TRUNK_QUARANTINE_QUERY_FAILURE_EXIT: "true"
        TRUNK_ORG_URL_SLUG: fake-org
        TRUNK_API_TOKEN: fake-token
        TRUNK_QUARANTINED_TESTS_DISK_CACHE_TTL_SECS: "0"
        TRUNK_API_CLIENT_RETRY_COUNT: "0"
        DISABLE_TELEMETRY: "true"

    - name: Run knapsack_pro queue and verify a single local bundle
      shell: bash
      if: inputs.alpine != 'true' && inputs.knapsack-pro-test-suite-token-rspec != ''
      working-directory: ${{ github.action_path }}
      env:
        KNAPSACK_PRO_TEST_DIR: spec
        # Required when using queue intialization
        KNAPSACK_PRO_TEST_FILE_PATTERN: spec/*.rb
        KNAPSACK_PRO_TEST_SUITE_TOKEN_RSPEC: ${{ inputs.knapsack-pro-test-suite-token-rspec }}
        KNAPSACK_PRO_CI_NODE_TOTAL: 1
        KNAPSACK_PRO_CI_NODE_INDEX: 0
        # https://docs.knapsackpro.com/ruby/queue-mode/#dynamic-split-vs-fixed-split
        KNAPSACK_PRO_FIXED_QUEUE_SPLIT: false
        TRUNK_API_TOKEN: ${{ inputs.trunk-token }}
        TRUNK_ORG_URL_SLUG: ${{ inputs.trunk-org-slug }}
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.trunk-public-api-address }}
        TRUNK_TEST_COLLECTION_ID: ${{ inputs.test-collection-id }}
        TRUNK_VARIANT: ${{ inputs.variant }}
        TRUNK_LOCAL_UPLOAD_DIR: bundles
      run: |
        set -euo pipefail
        rm -rf "${TRUNK_LOCAL_UPLOAD_DIR}"
        mkdir -p "${TRUNK_LOCAL_UPLOAD_DIR}"
        set +e
        # Initialize is not required, but some custom setups will use it
        bundle exec rake "knapsack_pro:queue:rspec:initialize"

        FILE_COUNT=$(find "${TRUNK_LOCAL_UPLOAD_DIR}" -maxdepth 1 -type f 2>/dev/null | wc -l)
        if [ "${FILE_COUNT}" -ne 0 ]; then
          echo "knapsack_pro manual queue initialization should not trigger an upload"
          ls -la "${TRUNK_LOCAL_UPLOAD_DIR}"
          exit 1
        fi

        OUTPUT_FILE=$(mktemp)
        bundle exec rake "knapsack_pro:queue:rspec" 2>&1 | tee "${OUTPUT_FILE}"
        set -e
        OUTPUT=$(cat "${OUTPUT_FILE}")
        rm -f "${OUTPUT_FILE}"

        FILE_COUNT=$(find "${TRUNK_LOCAL_UPLOAD_DIR}" -maxdepth 1 -type f 2>/dev/null | wc -l)
        if [ "${FILE_COUNT}" -ne 1 ]; then
          echo "knapsack_pro execution run should trigger an upload"
          ls -la "${TRUNK_LOCAL_UPLOAD_DIR}"
          exit 1
        fi

        REPORT_COUNT=$(echo "${OUTPUT}" | grep -c "Local Flaky tests report generated" || echo "0")
        if [ "${REPORT_COUNT}" -ne 1 ]; then
          echo "Expected 'Local Flaky tests report generated' to appear exactly once, found ${REPORT_COUNT} times"
          exit 1
        fi

        echo "Knapsack run correctly generated exactly one bundle"
