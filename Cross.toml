[target.x86_64-unknown-illumos.env]
passthrough = [
  "RANLIB=/usr/local/x86_64-unknown-illumos/bin/x86_64-unknown-illumos-ranlib",
]

# cross's main images moved to Ubuntu 24.04 (glibc 2.39); RHEL 8/9 and SLES 15 run older.
[target.powerpc64le-unknown-linux-gnu]
image = "ghcr.io/cross-rs/powerpc64le-unknown-linux-gnu:0.2.5"

[target.s390x-unknown-linux-gnu]
image = "ghcr.io/cross-rs/s390x-unknown-linux-gnu:0.2.5"
