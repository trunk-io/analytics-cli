[target.x86_64-unknown-illumos.env]
passthrough = [
  "RANLIB=/usr/local/x86_64-unknown-illumos/bin/x86_64-unknown-illumos-ranlib",
]

# cross's main images link against glibc 2.39, newer than RHEL 8/9 and SLES 15. ppc64le links
# through zig, because a binary linked in the old 0.2.5 image crashes on glibc 2.34 and newer;
# zig cannot link s390x, whose 0.2.5-image binary runs on every glibc.
[target.powerpc64le-unknown-linux-gnu]
zig = "2.28"

[target.s390x-unknown-linux-gnu]
image = "ghcr.io/cross-rs/s390x-unknown-linux-gnu:0.2.5"
